<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<title>小手机</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="apps/appearance.css">
<link rel="stylesheet" href="apps/api.css">
<link rel="stylesheet" href="apps/music.css">
<link rel="stylesheet" href="apps/books.css">
<link rel="stylesheet" href="apps/archive.css">
<link rel="stylesheet" href="apps/lorebook.css">
<link rel="stylesheet" href="apps/presets.css">
<link rel="stylesheet" href="apps/converter.css?v=3">
<link rel="stylesheet" href="apps/memory.css">
<link rel="stylesheet" href="apps/takeout.css">
<link rel="stylesheet" href="apps/chat.css">
<link rel="stylesheet" href="apps/chat-contacts.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="wallpaper" id="wallpaper"></div>
  <div class="home" id="home">
    <div class="home-pages" id="homePages">
      <!-- 第一页：已做好的 App -->
      <div class="home-page">
        <div class="grid">
          <div class="app" data-app="api">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>
            </div>
            <div class="app-name">API</div>
          </div>
          <div class="app" data-app="books">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </div>
            <div class="app-name">图书</div>
          </div>
          <div class="app" data-app="music">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <div class="app-name">音乐</div>
          </div>
          <div class="app" data-app="archive">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="app-name">档案</div>
          </div>
          <div class="app" data-app="presets">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            </div>
            <div class="app-name">预设</div>
          </div>
          <div class="app" data-app="lorebook">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </div>
            <div class="app-name">世界书</div>
          </div>
          <div class="app" data-app="memory">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
            </div>
            <div class="app-name">记忆</div>
          </div>
          <div class="app" data-app="takeout">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div class="app-name">小团外卖</div>
          </div>
          <div class="app" data-app="converter">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </div>
            <div class="app-name">转换器</div>
          </div>
        </div>
      </div>

      <!-- 第二页：占位的 App -->
      <div class="home-page">
        <div class="grid">
          <div class="app" data-app="offline">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="app-name">线下</div>
          </div>
          <div class="app" data-app="beautify">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.5l-5.2 3.8L16.5 20 12 16.6 7.5 20l1.7-5.7L4 10.5l6.1-1.7L12 3z"/></svg>
            </div>
            <div class="app-name">美化</div>
          </div>
          <div class="app" data-app="photos">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="app-name">照片</div>
          </div>
          <div class="app" data-app="appstore">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L4.5 18"/><path d="M12 3L19.5 18"/><line x1="3" y1="14.5" x2="21" y2="14.5"/><line x1="7" y1="18" x2="8.5" y2="18"/><line x1="15.5" y1="18" x2="17" y2="18"/></svg>
            </div>
            <div class="app-name">App Store</div>
          </div>
          <div class="app" data-app="games">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15.5" cy="11" r="0.8" fill="currentColor"/><circle cx="17.5" cy="13" r="0.8" fill="currentColor"/></svg>
            </div>
            <div class="app-name">游戏</div>
          </div>
          <div class="app" data-app="shopping">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </div>
            <div class="app-name">购物</div>
          </div>
          <div class="app" data-app="chat">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="app-name">Chat</div>
          </div>
          <div class="app" data-app="netflix">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><polygon points="10 9 16 12 10 15 10 9"/></svg>
            </div>
            <div class="app-name">Netflix</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-dots" id="pageDots">
      <span class="page-dot active" data-page="0"></span>
      <span class="page-dot" data-page="1"></span>
    </div>

    <div class="dock glass">
      <div class="app" data-app="settings">
        <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
      </div>
      <div class="app" data-app="appearance">
        <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </div>
      </div>
      <div class="app" data-app="imessage">
        <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="app-screen" id="app-appearance"></div>
  <div class="app-screen" id="app-api"></div>
  <div class="app-screen" id="app-music"></div>
  <div class="app-screen" id="app-books"></div>
  <div class="app-screen" id="app-archive"></div>
  <div class="app-screen" id="app-lorebook"></div>
  <div class="app-screen" id="app-presets"></div>
  <div class="app-screen" id="app-converter"></div>
  <div class="app-screen" id="app-memory"></div>
  <div class="app-screen" id="app-takeout"></div>
  <div class="app-screen" id="app-chat"></div>
  <div class="lock-screen" id="lockScreen">
    <div class="lock-wallpaper" id="lockWallpaper"></div>
    <div class="lock-clock">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
    </div>
    <div class="lock-bottom">
      <div class="lock-hint">向上轻扫解锁</div>
      <div class="lock-bar"></div>
    </div>
  </div>
</div>
<script src="app.js?v=4"></script>
<script src="apps/appearance.js"></script>
<script src="apps/api.js"></script>
<script src="apps/music.js"></script>
<script src="apps/books.js"></script>
<script src="apps/archive.js"></script>
<script src="apps/lorebook.js"></script>
<script src="apps/presets.js"></script>
<script src="apps/converter.js?v=3"></script>
<script src="apps/memory.js"></script>
<script src="apps/takeout.js"></script>
<script src="apps/chat.js"></script>
<script src="apps/chat-contacts.js"></script>
</body>
</html>
