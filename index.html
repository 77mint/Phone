<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<title>小手机</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="apps/appearance.css">
<link rel="stylesheet" href="apps/api.css">
<link rel="stylesheet" href="apps/music.css">
<link rel="stylesheet" href="apps/books.css">
<link rel="stylesheet" href="apps/archive.css">
<link rel="stylesheet" href="apps/lorebook.css">
<link rel="stylesheet" href="apps/presets.css">
<link rel="stylesheet" href="apps/converter.css?v=3">
<link rel="stylesheet" href="apps/memory.css">
<link rel="stylesheet" href="apps/takeout.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="wallpaper" id="wallpaper"></div>
  <div class="home" id="home">
    <div class="home-pages" id="homePages">
      <!-- 第一页：已做好的 App -->
      <div class="home-page">
        <div class="grid">
          <div class="app" data-app="appearance">
            <div class="app-icon has-custom-icon" data-default-icon="icons/A7EE88CF-C100-4741-A665-F0CBF7255BB9.jpeg" style="background-image: url('icons/A7EE88CF-C100-4741-A665-F0CBF7255BB9.jpeg');"></div>
            <div class="app-name">外观</div>
          </div>
          <div class="app" data-app="api">
            <div class="app-icon has-custom-icon" data-default-icon="icons/44338454-03E6-44C1-B306-57D7206E0E1F.png" style="background-image: url('icons/44338454-03E6-44C1-B306-57D7206E0E1F.png');"></div>
            <div class="app-name">API</div>
          </div>
          <div class="app" data-app="books">
            <div class="app-icon has-custom-icon" data-default-icon="icons/FE1D44B7-0313-4551-A668-7AC831164C94.png" style="background-image: url('icons/FE1D44B7-0313-4551-A668-7AC831164C94.png');"></div>
            <div class="app-name">图书</div>
          </div>
          <div class="app" data-app="music">
            <div class="app-icon has-custom-icon" data-default-icon="icons/F7E634B7-96B3-4975-981A-213BF88525AB.png" style="background-image: url('icons/F7E634B7-96B3-4975-981A-213BF88525AB.png');"></div>
            <div class="app-name">音乐</div>
          </div>
          <div class="app" data-app="archive">
            <div class="app-icon has-custom-icon" data-default-icon="icons/89F33D59-1FAC-4A7E-A3BE-4108BF89EF01.png" style="background-image: url('icons/89F33D59-1FAC-4A7E-A3BE-4108BF89EF01.png');"></div>
            <div class="app-name">档案</div>
          </div>
          <div class="app" data-app="presets">
            <div class="app-icon has-custom-icon" data-default-icon="icons/D18A90EB-494C-42A1-AB6A-DC95855BE154.png" style="background-image: url('icons/D18A90EB-494C-42A1-AB6A-DC95855BE154.png');"></div>
            <div class="app-name">预设</div>
          </div>
          <div class="app" data-app="lorebook">
            <div class="app-icon has-custom-icon" data-default-icon="icons/E47F6601-2028-4169-AF53-07CB6F2643F3.png" style="background-image: url('icons/E47F6601-2028-4169-AF53-07CB6F2643F3.png');"></div>
            <div class="app-name">世界书</div>
          </div>
          <div class="app" data-app="memory">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
            </div>
            <div class="app-name">记忆</div>
          </div>
          <div class="app" data-app="takeout">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            </div>
            <div class="app-name">小团外卖</div>
          </div>
          <div class="app" data-app="converter">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </div>
            <div class="app-name">转换器</div>
          </div>
        </div>
      </div>

      <!-- 第二页：占位的 App -->
      <div class="home-page">
        <div class="grid">
          <div class="app" data-app="offline">
            <div class="app-icon has-custom-icon" data-default-icon="icons/585720EB-9A0B-4804-B08A-1057EBBCF505.png" style="background-image: url('icons/585720EB-9A0B-4804-B08A-1057EBBCF505.png');"></div>
            <div class="app-name">线下</div>
          </div>
          <div class="app" data-app="beautify">
            <div class="app-icon has-custom-icon" data-default-icon="icons/A1064DCD-D94D-408A-95A0-D2B72B4ACEB4.png" style="background-image: url('icons/A1064DCD-D94D-408A-95A0-D2B72B4ACEB4.png');"></div>
            <div class="app-name">美化</div>
          </div>
          <div class="app" data-app="photos">
            <div class="app-icon bg-3">🖼️</div>
            <div class="app-name">照片</div>
          </div>
          <div class="app" data-app="settings">
            <div class="app-icon has-custom-icon" data-default-icon="icons/0344588B-36B5-4191-BB45-8C3B4D3D3C11.png" style="background-image: url('icons/0344588B-36B5-4191-BB45-8C3B4D3D3C11.png');"></div>
            <div class="app-name">设置</div>
          </div>
          <div class="app" data-app="appstore">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L4.5 18"/><path d="M12 3L19.5 18"/><line x1="3" y1="14.5" x2="21" y2="14.5"/><line x1="7" y1="18" x2="8.5" y2="18"/><line x1="15.5" y1="18" x2="17" y2="18"/></svg>
            </div>
            <div class="app-name">App Store</div>
          </div>
          <div class="app" data-app="games">
            <div class="app-icon" style="background:#ffffff;color:#111111;display:flex;align-items:center;justify-content:center;">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15.5" cy="11" r="0.8" fill="currentColor"/><circle cx="17.5" cy="13" r="0.8" fill="currentColor"/></svg>
            </div>
            <div class="app-name">游戏</div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-dots" id="pageDots">
      <span class="page-dot active" data-page="0"></span>
      <span class="page-dot" data-page="1"></span>
    </div>

    <div class="dock glass">
      <div class="app" data-app="imessage">
        <div class="app-icon has-custom-icon" data-default-icon="icons/96F5628F-BDB4-485D-B17A-80107A8961A7.png" style="background-image: url('icons/96F5628F-BDB4-485D-B17A-80107A8961A7.png');"></div>
      </div>
    </div>
  </div>
  <div class="app-screen" id="app-appearance"></div>
  <div class="app-screen" id="app-api"></div>
  <div class="app-screen" id="app-music"></div>
  <div class="app-screen" id="app-books"></div>
  <div class="app-screen" id="app-archive"></div>
  <div class="app-screen" id="app-lorebook"></div>
  <div class="app-screen" id="app-presets"></div>
  <div class="app-screen" id="app-converter"></div>
  <div class="app-screen" id="app-memory"></div>
  <div class="app-screen" id="app-takeout"></div>
  <div class="lock-screen" id="lockScreen">
    <div class="lock-wallpaper" id="lockWallpaper"></div>
    <div class="lock-clock">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
    </div>
    <div class="lock-bottom">
      <div class="lock-hint">向上轻扫解锁</div>
      <div class="lock-bar"></div>
    </div>
  </div>
</div>
<script src="app.js?v=3"></script>
<script src="apps/appearance.js"></script>
<script src="apps/api.js"></script>
<script src="apps/music.js"></script>
<script src="apps/books.js"></script>
<script src="apps/archive.js"></script>
<script src="apps/lorebook.js"></script>
<script src="apps/presets.js"></script>
<script src="apps/converter.js?v=3"></script>
<script src="apps/memory.js"></script>
<script src="apps/takeout.js"></script>
</body>
</html>
