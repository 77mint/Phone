<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<title>小手机</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="apps/appearance.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="wallpaper" id="wallpaper"></div>
  <div class="home" id="home">
    <div class="grid">
      <div class="app" data-app="appearance">
        <div class="app-icon bg-1">🎨</div>
        <div class="app-name">外观</div>
      </div>
    </div>
    <div class="dock glass">
      <div class="app" data-app="chat">
        <div class="app-icon bg-2">💬</div>
      </div>
      <div class="app" data-app="photos">
        <div class="app-icon bg-3">🖼️</div>
      </div>
      <div class="app" data-app="music">
        <div class="app-icon bg-4">🎵</div>
      </div>
      <div class="app" data-app="settings">
        <div class="app-icon bg-5">⚙️</div>
      </div>
    </div>
  </div>
  <div class="app-screen" id="app-appearance"></div>
  <div class="lock-screen" id="lockScreen">
    <div class="lock-wallpaper" id="lockWallpaper"></div>
    <div class="lock-clock">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
    </div>
    <div class="lock-bottom">
      <div class="lock-hint">向上轻扫解锁</div>
      <div class="lock-bar"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script src="apps/appearance.js"></script>
</body>
</html>
